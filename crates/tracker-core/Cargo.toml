[package]
name = "tracker-core"
version = "0.1.0"
edition = "2021"
description = "Rules, persistence and state for the time tracker. No Tauri dependency."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

[dev-dependencies]
tempfile = "3"

