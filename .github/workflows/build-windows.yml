name: build-windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Add --locked / switch to `npm ci` once Cargo.lock and package-lock.json are committed.
      - name: Rust tests (tracker-core)
        run: cargo test -p tracker-core
      - name: Install JS dependencies
        run: npm install
      - name: UI tests
        run: npm test
      - name: Type check
        run: npm run lint
      - name: Generate icons
        run: npm run icons
      - name: Build executable and installer
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: time-tracker-windows
          path: |
            target/release/tracker.exe
            target/release/bundle/nsis/*.exe

